<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Today's Date</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: #efe9e1;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  #card {
    width: 100%;
    max-width: 340px;
    background: #fbf8f4;
    border: 1px solid #ddd1c2;
    padding: 36px 32px 32px;
    text-align: center;
    position: relative;
  }

  #card::before {
    content: "";
    position: absolute;
    top: 10px; left: 10px; right: 10px; bottom: 10px;
    border: 1px solid #e4d9c8;
    pointer-events: none;
  }

  #weekday {
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #a4835f;
    font-weight: 600;
    margin-bottom: 18px;
  }

  #day-number {
    font-family: 'Fraunces', Georgia, serif;
    font-size: 76px;
    line-height: 1;
    color: #5b4636;
    font-weight: 500;
    letter-spacing: -2px;
  }

  #month-year {
    margin-top: 10px;
    font-size: 16px;
    color: #8a7863;
    font-weight: 500;
  }

  #divider {
    width: 36px;
    height: 1px;
    background: #c9b8a3;
    margin: 20px auto;
  }

  #time {
    font-size: 12px;
    letter-spacing: 1.5px;
    color: #b0a08c;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <div id="card">
    <div id="weekday"></div>
    <div id="day-number"></div>
    <div id="month-year"></div>
    <div id="divider"></div>
    <div id="time"></div>
  </div>

  <script>
    function pad(n) { return n.toString().padStart(2, '0'); }

    function updateWidget() {
      const now = new Date();

      const weekday = now.toLocaleDateString(undefined, { weekday: 'long' });
      const day = now.getDate();
      const month = now.toLocaleDateString(undefined, { month: 'long' });
      const year = now.getFullYear();

      document.getElementById('weekday').textContent = weekday;
      document.getElementById('day-number').textContent = day;
      document.getElementById('month-year').textContent = month + ' ' + year;
      document.getElementById('time').textContent =
        pad(now.getHours()) + ':' + pad(now.getMinutes());
    }

    updateWidget();
    setInterval(updateWidget, 1000);
  </script>
</body>
</html>
